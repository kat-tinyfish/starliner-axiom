# Streamlit Cloud Secrets Configuration
# Copy this content to Streamlit Cloud → App Settings → Secrets

# =============================================================================
# REQUIRED - Supabase Database
# =============================================================================
SUPABASE_URL = "https://your-project-id.supabase.co"
SUPABASE_KEY = "your-anon-public-key-here"

# =============================================================================
# OPTIONAL - Agent API Keys
# =============================================================================
# Add the ones you have. App works without these but can't execute real agents.

OPENAI_API_KEY = "sk-..."
ANTHROPIC_API_KEY = "sk-ant-..."
GOOGLE_API_KEY = "..."
# TINYFISH_API_KEY = "..."  # Optional if you have TinyFish access

# =============================================================================
# BROWSER EXECUTION - Choose ONE option:
# =============================================================================

# Option A: AWS Lambda (if you built it - has compatibility issues)
# AWS_LAMBDA_FUNCTION_URL = "https://your-function-url.lambda-url.us-east-1.on.aws/"

# Option B: BrowserBase (RECOMMENDED - free tier, works out of the box!)
BROWSERBASE_API_KEY = "bb_live_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
BROWSERBASE_PROJECT_ID = "proj_xxxxxxxxxxxxxxxx"

# =============================================================================
# How to Get These Values:
# =============================================================================
# 
# SUPABASE:
#   1. Go to https://supabase.com/dashboard
#   2. Select your project
#   3. Settings → API
#   4. Copy URL and anon/public key
#
# OPENAI:
#   1. Go to https://platform.openai.com/api-keys
#   2. Create new secret key
#
# ANTHROPIC:
#   1. Go to https://console.anthropic.com/settings/keys
#   2. Create API key
#
# GOOGLE:
#   1. Go to https://makersuite.google.com/app/apikey
#   2. Create API key
#
# BROWSERBASE (RECOMMENDED):
#   1. Go to https://www.browserbase.com/sign-up
#   2. Sign up (free tier: 1 hour/month, perfect for testing)
#   3. Settings → API Keys → Create API Key
#   4. Projects → Copy your Project ID
#   5. See build_docs/BROWSERBASE_SETUP.md for detailed guide
#
# LAMBDA (if using):
#   1. AWS Lambda Console → Your function
#   2. Configuration → Function URL
#   3. Copy the URL
# =============================================================================

