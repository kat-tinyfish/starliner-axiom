version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/web-agent-executor
      - IMAGE_TAG=${CODEBUILD_RESOLVED_SOURCE_VERSION:-latest}
      - echo Repository URI is $REPOSITORY_URI
  
  build:
    commands:
      - echo Build started on `date`
      - echo Building the Docker image...
      - cd lambda
      - |
        cat > Dockerfile << 'EOF'
        FROM public.ecr.aws/lambda/python:3.12

        # Install Node.js 18 (required for Playwright)
        RUN dnf install -y tar gzip && \
            curl -fsSL https://nodejs.org/dist/v18.19.0/node-v18.19.0-linux-x64.tar.gz | tar -xz -C /usr/local --strip-components=1 && \
            dnf clean all

        # Install system dependencies for Chromium
        RUN dnf install -y \
            atk \
            cups-libs \
            gtk3 \
            libXcomposite \
            libXcursor \
            libXdamage \
            libXext \
            libXi \
            libXrandr \
            libXScrnSaver \
            libXtst \
            pango \
            alsa-lib \
            libdrm \
            mesa-libgbm \
            nss \
            xdg-utils \
            && dnf clean all

        # Install VNC Server for browser streaming
        RUN dnf install -y \
            tigervnc-server \
            git \
            && dnf clean all

        # Install noVNC for web access
        RUN git clone https://github.com/novnc/noVNC.git /opt/noVNC && \
            cd /opt/noVNC && \
            git checkout v1.4.0 && \
            ln -s /opt/noVNC/vnc.html /opt/noVNC/index.html

        # Configure VNC environment variables
        ENV DISPLAY=:99
        ENV VNC_PORT=5900
        ENV NOVNC_PORT=6080
        RUN mkdir -p ~/.vnc

        # Copy function code
        COPY handler.py agent_executor.py vnc_manager.py ${LAMBDA_TASK_ROOT}/

        # Install Python dependencies
        COPY requirements.txt .
        RUN pip install -r requirements.txt --target "${LAMBDA_TASK_ROOT}"

        # Install Playwright
        RUN pip install playwright --target "${LAMBDA_TASK_ROOT}"

        # Replace Playwright's bundled Node.js with system Node.js
        # This fixes GLIBC compatibility issues on Amazon Linux 2
        RUN rm -f ${LAMBDA_TASK_ROOT}/playwright/driver/node && \
            ln -s /usr/local/bin/node ${LAMBDA_TASK_ROOT}/playwright/driver/node

        # Install Playwright browsers (dependencies already installed via dnf)
        # Set environment variables for Playwright
        ENV PLAYWRIGHT_BROWSERS_PATH=/opt/ms-playwright
        RUN PLAYWRIGHT_BROWSERS_PATH=/opt/ms-playwright \
            python -m playwright install chromium

        # Set the CMD to your handler
        CMD [ "handler.lambda_handler" ]
        EOF
      - docker build --platform linux/amd64 -t $REPOSITORY_URI:latest .
      - docker tag $REPOSITORY_URI:latest $REPOSITORY_URI:$IMAGE_TAG
  
  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing the Docker images...
      - docker push $REPOSITORY_URI:latest
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - echo Writing image definitions file...
      - printf '{"ImageURI":"%s"}' $REPOSITORY_URI:latest > imageDetail.json

artifacts:
  files:
    - imageDetail.json

